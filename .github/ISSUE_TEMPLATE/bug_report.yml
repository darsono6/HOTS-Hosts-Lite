name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: HOTS Hosts Lite version
      description: Shown in Options → About
      placeholder: "1.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, 64-bit
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
  - type: textarea
    id: log
    attributes:
      label: error.log (optional)
      description: 'Found in %APPDATA%\HOTS Hosts Lite\error.log. Please review it before pasting.'
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
